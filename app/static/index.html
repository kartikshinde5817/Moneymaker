<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#152029; --bg:#EEF2F5; --panel:#FFF; --panel-2:#F6F9FB;
  --line:#DCE4EA; --muted:#5D6D7B;
  --brand:#0E7490; --brand-2:#06B6D4; --gold:#D97706;
  --good:#0E9F6E; --warn:#DC2626; --dark:#141E28; --dark-2:#1C2833;
  --r:12px; --r-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100%;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.3px}

/* sidebar */
.side{width:225px;flex-shrink:0;background:var(--dark);color:#C6D3DC;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px}
.brand h1{font-size:19px;color:#fff;margin:0;font-weight:600}
.brand span{display:block;font-size:10.5px;color:#6C8091;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#93A7B6;padding:9px 11px;border-radius:var(--r-sm);font-weight:500;transition:.12s}
.nav button:hover{background:var(--dark-2);color:#E2EDF3}
.nav button.on{background:var(--brand);color:#fff}
.nav .pip{margin-left:auto;background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
.nav button.on .pip{background:rgba(255,255,255,.25)}
.side-foot{margin-top:auto;font-size:11.5px;color:#5C6E7C;line-height:1.6;padding:12px 6px 0;border-top:1px solid #232F3A}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--dark-2);margin:0 4px 4px 0}
.chip.ok{color:var(--brand-2)} .chip.off{color:#8A7A4E}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* main */
.main{flex:1;min-width:0;height:100vh;overflow-y:auto}
.view{padding:24px 28px 70px;max-width:1500px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:21px;margin:0 0 3px}
.head p{color:var(--muted);margin:0;font-size:13px;max-width:70ch}

/* generic */
.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.12s;text-decoration:none}
.btn:hover{border-color:var(--brand);background:var(--panel-2)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.good:hover{filter:brightness(1.08);background:var(--good)}
.btn.danger{color:var(--warn);border-color:#F0C7C7}
.btn.danger:hover{background:#FEF2F2;border-color:var(--warn)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.sp{flex:1}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tile .v{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:600;margin-top:6px;letter-spacing:-1px}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.tile.hot .v{color:var(--gold)}
.tile.act{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,116,144,.09)}

/* table */
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--panel-2);text-align:left;padding:9px 12px;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
.biz{font-weight:600}
.biz small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px}

.score{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;border-radius:6px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.score.high{background:#FEF3E2;color:#B45309}
.score.med{background:#E0F2F7;color:#0E7490}
.score.low{background:#EEF2F5;color:#64748B}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.new,.pill.discovered,.pill.researched{background:#EEF2F5;color:#546471}
.pill.scored,.pill.drafted{background:#E0F2F7;color:#0E7490}
.pill.pending_approval{background:#FEF3E2;color:#B45309}
.pill.queued,.pill.sending{background:#E5F6FA;color:#0B7285}
.pill.sent,.pill.contacted{background:#E7F6EF;color:#0E7A54}
.pill.rejected,.pill.failed,.pill.unqualified,.pill.below_threshold{background:#FBEAEA;color:#B42318}
.pill.replied{background:#FEF3E2;color:#B45309}
.tag{display:inline-block;background:#E0F2F7;color:var(--brand);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.tag.grey{background:#EEF2F5;color:#546471}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;background:var(--panel);color:var(--ink);font-size:13px}
.filters input[type=search]{min-width:200px}

/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.inp{display:flex;flex-direction:column;gap:5px}
.inp label{font-size:12px;font-weight:600}
.inp input,.inp select,.inp textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--panel-2);color:var(--ink);width:100%}
.inp input:focus,.inp textarea:focus,.inp select:focus{outline:2px solid var(--brand-2);background:#fff}
.inp textarea{min-height:150px;resize:vertical;line-height:1.6;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.inp .fine{font-size:11px;color:var(--muted)}

/* outbox */
.ob{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.ev{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;font-size:12.5px;line-height:1.55}
.ev.cited{border-left-color:var(--gold);background:#FFFBF3}
.ev .t{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:3px;display:flex;gap:7px;align-items:center}
.ev .q{color:var(--ink)}
.ev a{font-size:11.5px;word-break:break-all}
.badge{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.3px}
.badge.exp{background:#FEF3E2;color:#B45309}
.badge.inf{background:#EEF2F5;color:#64748B}
.badge.cit{background:var(--gold);color:#fff}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;z-index:40}
.drawer-bg.on{display:block}
.drawer{position:fixed;top:0;right:0;width:760px;max-width:100%;height:100vh;background:var(--bg);box-shadow:-10px 0 40px -12px rgba(0,0,0,.3);overflow-y:auto;padding:24px 26px 60px;z-index:41;transform:translateX(100%);transition:transform .2s}
.drawer.on{transform:none}

/* log */
.log{background:var(--dark);color:#C9D6DF;border-radius:var(--r-sm);padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;max-height:440px;overflow-y:auto;white-space:pre-wrap}


/* ==================== agent control room ==================== */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinAng{to{--ang:360deg}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,30px) scale(1.18)}100%{transform:translate(-50px,60px) scale(.92)}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes radar{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.2);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes tick{0%{transform:translateY(-35%);opacity:.2;filter:blur(2px)}100%{transform:none;opacity:1;filter:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes packet{0%{left:-4px;opacity:0}20%{opacity:1}80%{opacity:1}100%{left:calc(100% - 2px);opacity:0}}
@keyframes hueflow{to{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.btn.go{background:linear-gradient(135deg,#06B6D4,#8B5CF6);color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px rgba(139,92,246,.85)}
.btn.go:hover{background:linear-gradient(135deg,#06B6D4,#8B5CF6);filter:brightness(1.1);border-color:transparent}

.hx{position:relative;isolation:isolate;overflow:hidden;border-radius:18px;padding:24px 24px 20px;margin-bottom:16px;color:#E6EEF5;
  background:radial-gradient(900px 380px at 0% 0%,#14284A 0%,#0B1324 58%,#090F1C 100%);box-shadow:0 24px 50px -28px rgba(8,20,40,.75)}
.hx-ring{position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:3;
  background:conic-gradient(from var(--ang),rgba(34,211,238,0) 0deg,#22D3EE 70deg,#A78BFA 140deg,#F472B6 210deg,rgba(244,114,182,0) 280deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:spinAng 7s linear infinite}
.hx.live .hx-ring{animation-duration:2.6s}
.hx .blob{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(80px);opacity:.38;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
.hx .b1{background:#06B6D4;top:-210px;left:-120px}
.hx .b2{background:#8B5CF6;top:-190px;right:-110px;animation-duration:23s;animation-delay:-6s}
.hx .b3{background:#EC4899;bottom:-260px;left:38%;opacity:.25;animation-duration:27s;animation-delay:-11s}
.hx.live .b1{background:#22D3EE;opacity:.5}
.hx-grid{position:absolute;inset:0;z-index:-1;opacity:.55;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse at 30% 0%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 30% 0%,#000 20%,transparent 75%)}
.hx-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.hx-main{min-width:0;animation:riseIn .6s cubic-bezier(.2,.8,.2,1) both}
.pchip{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1.4px;padding:5px 11px;border-radius:20px;
  background:rgba(167,139,250,.14);color:#C4B5FD;border:1px solid rgba(167,139,250,.28)}
.pchip .pd{position:relative;width:7px;height:7px;border-radius:50%;background:currentColor}
.pchip .pd::after{content:'';position:absolute;inset:0;border-radius:50%;background:currentColor;animation:radar 1.8s ease-out infinite}
.pchip.live{background:rgba(34,211,238,.14);color:#67E8F9;border-color:rgba(34,211,238,.32)}
.pchip.live .pd::after{animation-duration:1s}
.pchip.off{background:rgba(255,255,255,.07);color:#94A3B8;border-color:rgba(255,255,255,.12)}
.pchip.off .pd::after{display:none}
.hx-title{font-family:'Space Grotesk',sans-serif;font-size:34px;line-height:1.1;margin:12px 0 7px;letter-spacing:-1px;font-weight:700;overflow-wrap:anywhere;
  background:linear-gradient(90deg,#fff 0%,#A5F3FC 35%,#C4B5FD 65%,#F9A8D4 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:hueflow 6s linear infinite alternate}
.hx-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:#9FB2C6;font-size:13px}
.hx-meta .tag{background:rgba(255,255,255,.09);color:#E2E8F0}
.hx-meta .sep{width:3px;height:3px;border-radius:50%;background:#4B5D72}
.hx-note{color:#9FB2C6;font-size:13px;margin:14px 0 0;max-width:52ch;line-height:1.55}

.cd{display:flex;align-items:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.cd-u{display:flex;flex-direction:column;align-items:center;gap:6px}
.cd-u[hidden]{display:none}
.cd-u b{display:block;min-width:66px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;line-height:1;
  padding:12px 8px 10px;border-radius:14px;color:#fff;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px -14px rgba(34,211,238,.6)}
.cd-u b.tick{animation:tick .45s cubic-bezier(.2,.8,.2,1)}
.cd-u span{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#7F93A8;font-weight:600}
.cd>i{font-style:normal;font-family:'Space Grotesk',sans-serif;font-size:32px;color:#4B6079;padding-bottom:26px;animation:blink 1s steps(2,start) infinite}
.cd-go{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#67E8F9;animation:blink 1s ease-in-out infinite}

.hx-live{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.hx-stage{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;min-width:150px}
.hx-stage span{display:block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#7F93A8;font-weight:600;margin-bottom:4px}
.hx-stage b{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff}
.hx-item{margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8FB3C9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hx-queue{min-width:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:riseIn .6s .1s cubic-bezier(.2,.8,.2,1) both}
.hx-qh{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#7F93A8;font-weight:700;padding:2px 4px 8px}
.hx-qh span{letter-spacing:0;text-transform:none;font-weight:600;color:#5F7389}
.hx-q{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 9px;color:#DCE6EF;
  transition:background .15s,border-color .15s,transform .15s}
.hx-q:hover{background:rgba(255,255,255,.06);transform:translateX(3px)}
.hx-q:focus-visible{outline:2px solid #67E8F9;outline-offset:1px}
.hx-q.first{background:linear-gradient(90deg,rgba(34,211,238,.15),rgba(167,139,250,.08));border-color:rgba(34,211,238,.28)}
.hx-q .qd{width:9px;height:9px;border-radius:50%;background:var(--h);box-shadow:0 0 10px var(--h);flex-shrink:0}
.hx-q .qn{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-q .qn small,.hx-q .qt small{display:block;font-weight:500;font-size:11px;color:#7F93A8}
.hx-q .qt{text-align:right;font-size:12px;font-weight:600;white-space:nowrap}
.hx-q.first .qt small{color:#67E8F9}
.hx-empty{color:#7F93A8;font-size:12.5px;padding:8px 4px}

.hx-stats{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.hx-cap{font-size:12px;color:#8BA0B5;margin-bottom:12px;line-height:1.5}
.hx-cap b{color:#E2E8F0;font-weight:600}
.hx-tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.hx-t{position:relative;overflow:hidden;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:12px 12px 11px;
  animation:riseIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 55ms);transition:transform .2s,border-color .2s}
.hx-t:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--h) 55%,transparent)}
.hx-t::before{content:'';position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--h),transparent)}
.hx-t .ti{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--h);background:color-mix(in srgb,var(--h) 16%,transparent)}
.hx-t .tv{display:block;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#fff;margin-top:8px;line-height:1;font-variant-numeric:tabular-nums;transform-origin:left center}
.hx-t .tv.zero{color:#53667B}
.hx-t .tk{display:block;font-size:11px;color:#8BA0B5;margin-top:4px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx.live .hx-t::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%);
  background-size:250% 100%;animation:sheen 2.4s linear infinite}
.bump{animation:bump .5s cubic-bezier(.2,.8,.2,1)}

/* pipeline */
.wf{position:relative;isolation:isolate;overflow:hidden;border-radius:18px;padding:20px 20px 16px;
  background:linear-gradient(180deg,#0D1628 0%,#0A1120 100%);box-shadow:0 24px 50px -30px rgba(8,20,40,.7)}
.wf::before{content:'';position:absolute;inset:0;z-index:-1;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);
  background-size:20px 20px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 90%);mask-image:linear-gradient(180deg,#000,transparent 90%)}
.wf-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.wf-head h3{margin:0;color:#fff;font-size:15px}
.wf-sub{color:#7E93A3;font-size:12.5px}
.wf-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.5px;padding:4px 10px;border-radius:20px;background:rgba(6,182,212,.15);color:#22D3EE}
.wf-live.done{background:rgba(74,222,128,.13);color:#4ADE80}
.wf-live.fail{background:rgba(248,113,113,.15);color:#F87171}
.wf-live.idle{background:rgba(255,255,255,.07);color:#8FA3B2}
.wf-live .bl{width:6px;height:6px;border-radius:50%;background:currentColor}
.wf-live.run .bl{animation:blink 1.1s ease-in-out infinite}

.wf-flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:8px 2px 14px}
.wf-flow::-webkit-scrollbar{height:7px}
.wf-flow::-webkit-scrollbar-thumb{background:#2C3B49;border-radius:4px}

.node{--h:#22D3EE;flex:1 1 110px;min-width:100px;max-width:172px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px;
  transition:border-color .25s,box-shadow .25s,transform .25s,opacity .25s;animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 60ms)}
.node::before{content:'';position:absolute;left:10px;right:10px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--h),transparent);opacity:.4;transition:opacity .25s}
.node:hover{border-color:color-mix(in srgb,var(--h) 50%,transparent);transform:translateY(-2px)}
.node.done::before,.node.running::before{opacity:1}
.node.running{border-color:var(--h);transform:translateY(-4px);box-shadow:0 0 0 1px var(--h),0 14px 30px -10px var(--h)}
.node.running::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--h) 26%,transparent) 50%,transparent 70%);background-size:250% 100%;animation:sheen 1.5s linear infinite}
.node.error{border-color:#F87171}
.node.skipped{opacity:.45}
.node .ntop{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
.node .nico{position:relative;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:var(--h);background:color-mix(in srgb,var(--h) 15%,transparent)}
.node.running .nico{animation:float 1.2s ease-in-out infinite;background:color-mix(in srgb,var(--h) 28%,transparent)}
.node.error .nico{color:#F87171;background:rgba(248,113,113,.16)}
.node .okb{position:absolute;right:-4px;bottom:-4px;width:13px;height:13px;border-radius:50%;background:#22C55E;color:#06210F;font-size:9px;font-weight:800;
  display:none;place-items:center;box-shadow:0 0 0 2px #0D1628}
.node.done .okb{display:grid;animation:bump .5s cubic-bezier(.2,.8,.2,1)}
.node .nname{color:#EEF4F9;font-size:12.5px;font-weight:600;line-height:1.25;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nnote{color:#7488A0;font-size:10.5px;line-height:1.35;min-height:27px}
.node .nfoot{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07)}
.node .cnt{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.node .cnt.zero{color:#4D6075}
.node .nx{margin-left:auto;display:inline-flex}
.node .drop{font-size:10.5px;font-weight:700;color:#F87171;display:inline-flex;align-items:center;gap:3px}
.node .eng{margin-left:auto;font-size:8.5px;font-weight:700;letter-spacing:.4px;
  padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.07);color:#8197AE}
.node .eng.llm{background:rgba(251,191,36,.16);color:#FCD34D}
.node .ms{font-size:10px;color:#60748A}

.edge{flex:0 0 20px;align-self:center;height:2px;margin-top:4px;position:relative;background:rgba(255,255,255,.1);border-radius:2px}
.edge i{position:absolute;top:-2px;left:-4px;width:6px;height:6px;border-radius:50%;opacity:0}
.edge.past{background:linear-gradient(90deg,rgba(74,222,128,.25),rgba(74,222,128,.65))}
.edge.past i{background:#4ADE80;box-shadow:0 0 8px #4ADE80;animation:packet 2.6s linear infinite}
.edge.past i:nth-child(2){animation-delay:-.87s}
.edge.past i:nth-child(3){animation-delay:-1.73s}
.edge.on{background:linear-gradient(90deg,rgba(34,211,238,.3),#22D3EE)}
.edge.on i{background:#A5F3FC;box-shadow:0 0 10px #22D3EE;animation:packet .8s linear infinite}
.edge.on i:nth-child(2){animation-delay:-.27s}
.edge.on i:nth-child(3){animation-delay:-.53s}

.wf-now{display:flex;align-items:center;gap:10px;color:#A9BDCE;font-size:12.5px;line-height:1.5;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:10px 13px}
.wf-now b{color:#fff;font-weight:600}
.wf-now .nx-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:#0B1324;
  background:linear-gradient(135deg,#22D3EE,#A78BFA);box-shadow:0 6px 16px -6px rgba(167,139,250,.8)}
.wf-now .js-in{color:#67E8F9;font-weight:600}
.wf-detail{color:#7E93A3;font-size:11.5px;margin-top:2px;font-family:ui-monospace,Menlo,monospace}

.wf-term{background:rgba(3,8,16,.6);border:1px solid rgba(255,255,255,.07);border-radius:10px;margin-top:12px;
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.75;color:#9FB4C3;
  max-height:210px;overflow-y:auto;padding:11px 13px;white-space:pre-wrap}
.wf-term::-webkit-scrollbar{width:7px}
.wf-term::-webkit-scrollbar-thumb{background:#2C3B49;border-radius:4px}
.wf-term .ok{color:#4ADE80} .wf-term .no{color:#F87171} .wf-term .hl{color:#22D3EE}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:#6F8494}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ==================== campaigns ==================== */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px}
.camp{--h:#22D3EE;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 16px 12px;cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;animation:riseIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 50ms)}
.camp::before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--h),#A78BFA)}
.camp:hover,.camp:focus-visible{transform:translateY(-3px);border-color:color-mix(in srgb,var(--h) 55%,var(--line));
  box-shadow:0 18px 36px -22px color-mix(in srgb,var(--h) 75%,#000);outline:none}
.camp.off{opacity:.75}
.camp.off::before{background:#CBD5E1}
.camp-top{display:flex;align-items:center;gap:11px}
.camp-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0;
  background:linear-gradient(135deg,var(--h),#7C3AED);box-shadow:0 8px 18px -8px var(--h)}
.camp-name{flex:1;min-width:0}
.camp-name b{display:block;font-family:'Space Grotesk',sans-serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp-name small{color:var(--muted);font-size:12px}
.camp-when{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:14px 0 10px;font-size:12.5px;font-weight:600}
.camp-when svg{color:var(--muted)}
.camp-when .nx{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--brand);background:#E0F2F7;padding:3px 10px;border-radius:20px}
.camp-when .nx.off{color:#64748B;background:#EEF2F5}
.camp-when .nx.live{color:#fff;background:linear-gradient(90deg,#06B6D4,#8B5CF6);animation:blink 1.4s ease-in-out infinite}
.camp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.camp-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.camp-stats b{display:block;font-family:'Space Grotesk',sans-serif;font-size:18px}
.camp-stats span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.camp-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.camp-log{background:none;border:0;padding:4px 0;color:var(--muted);font-size:12px;text-align:left}
.camp-log:hover{color:var(--brand);text-decoration:underline}
.btn.icon{padding:5px 7px}
.btn.icon:hover{color:var(--warn)}

.sw{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:22px;background:#CBD5E1;transition:background .2s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+i{background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--brand-2);outline-offset:2px}

/* campaign editor (drawer) */
.ce-head{--h:#22D3EE;display:flex;align-items:center;gap:12px;margin:-24px -26px 18px;padding:22px 26px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(520px 220px at 0% 0%,color-mix(in srgb,var(--h) 55%,#0B1324),#0B1324);transition:background .3s}
.ce-head h2{margin:2px 0 0;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce-head .btn.ghost{color:#CBD5E1}
.ce-head .btn.ghost:hover{background:rgba(255,255,255,.08);color:#fff}
.ce-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,var(--h),#7C3AED);box-shadow:0 8px 20px -8px var(--h)}
.ce-kicker{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#A5F3FC;font-weight:700}
.ce-sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;
  animation:riseIn .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 50ms)}
.ce-sec h4{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-family:'Space Grotesk',sans-serif;font-size:15px}
.ce-sec h4 span{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--brand-2),#8B5CF6)}
.ce-sw{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:14px;cursor:pointer}
.ce-lbl{font-size:12px;font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);transition:.15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 4px 12px -4px rgba(6,182,212,.6)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:500;transition:.15s}
.chk small{font-size:10.5px;color:var(--muted)}
.chk:hover{border-color:var(--brand-2)}
.chk.on{background:#E0F7FB;border-color:var(--brand-2);color:#0B5466;font-weight:600}
.chk.on::before{content:'✓';font-weight:800;color:var(--brand)}
.chk.dim{opacity:.6}
.inp input[type=range]{padding:0;border:0;background:none;accent-color:var(--brand)}
.inp input:disabled{opacity:.55;cursor:not-allowed}
.ce-foot{position:sticky;bottom:-60px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin:16px -26px -60px;padding:14px 26px 22px;background:var(--bg);border-top:1px solid var(--line)}

@media (max-width:1250px){.hx-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1000px){.hx-top{grid-template-columns:1fr}}
@media (max-width:560px){
  .hx{padding:18px 16px 16px}
  .hx-title{font-size:26px}
  .cd-u b{min-width:50px;font-size:28px;padding:10px 6px 8px}
  .cd>i{font-size:24px;padding-bottom:22px}
  .hx-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ce-head{margin:-24px -16px 16px;padding:18px 16px}
  .ce-foot{margin:16px -16px -60px;padding:12px 16px 18px}
  .drawer{padding:24px 16px 60px}
  .camp-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:16px}
.bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--brand)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:12px 19px;border-radius:9px;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);opacity:0;transition:.28s;z-index:90;max-width:80vw}
.toast.on{transform:translateX(-50%);opacity:1}
.toast.bad{background:var(--warn)}
.toast.good{background:var(--good)}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:#FFFBF3;border:1px solid #F5D9A8;color:#8A5A0B;border-radius:var(--r-sm);padding:11px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.55}
.banner.bad{background:#FEF2F2;border-color:#F3C7C7;color:#9B1C1C}

@media (max-width:1000px){
  body{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .side-foot{display:none}
  .main{height:auto}
  .ob,.grid2{grid-template-columns:1fr}
  .view{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="13" fill="#06B6D4" opacity=".92"/>
      <path d="M16 8v16M12.5 11.5h5.2a2.8 2.8 0 0 1 0 5.6h-4.4a2.8 2.8 0 0 0 0 5.6H19" stroke="#0B3B47" stroke-width="2.1" stroke-linecap="round" fill="none"/>
    </svg>
    <div><h1>Money Maker</h1><span>lead generation &amp; outreach</span></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot" id="foot"></div>
</aside>

<main class="main"><div class="view" id="view"></div></main>

<div class="drawer-bg" id="drawerBg"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>

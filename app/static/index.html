<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PLATFORM}} — dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#152029; --bg:#EEF2F5; --panel:#FFF; --panel-2:#F6F9FB;
  --line:#DCE4EA; --muted:#5D6D7B;
  --brand:#0E7490; --brand-2:#06B6D4; --gold:#D97706;
  --good:#0E9F6E; --warn:#DC2626; --dark:#141E28; --dark-2:#1C2833;
  --r:12px; --r-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;min-height:100%;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.3px}

/* sidebar */
.side{width:225px;flex-shrink:0;background:var(--dark);color:#C6D3DC;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 20px}
.brand h1{font-size:19px;color:#fff;margin:0;font-weight:600}
.brand span{display:block;font-size:10.5px;color:#6C8091;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#93A7B6;padding:9px 11px;border-radius:var(--r-sm);font-weight:500;transition:.12s}
.nav button:hover{background:var(--dark-2);color:#E2EDF3}
.nav button.on{background:var(--brand);color:#fff}
.nav .pip{margin-left:auto;background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
.nav button.on .pip{background:rgba(255,255,255,.25)}
.nav .grp{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#4E6070;padding:14px 11px 6px}
.nav .grp:first-child{padding-top:0}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;margin-top:10px;border-top:1px solid #232F3A}
.me .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.me b{display:block;color:#E2EDF3;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:#6C8091;font-size:11px}
.me .out{margin-left:auto;background:none;border:1px solid #2A3846;color:#93A7B6;border-radius:8px;padding:5px 8px;font-size:11.5px;white-space:nowrap;flex-shrink:0}
.me .out:hover{color:#fff;border-color:#3C5265}
.side-foot{margin-top:auto;font-size:11.5px;color:#5C6E7C;line-height:1.6;padding:12px 6px 0;border-top:1px solid #232F3A}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--dark-2);margin:0 4px 4px 0}
.chip.ok{color:var(--brand-2)} .chip.off{color:#8A7A4E}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* main */
.main{flex:1;min-width:0;height:100vh;overflow-y:auto}
.view{padding:24px 28px 70px;max-width:1500px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:21px;margin:0 0 3px}
.head p{color:var(--muted);margin:0;font-size:13px;max-width:70ch}

/* generic */
.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.12s;text-decoration:none}
.btn:hover{border-color:var(--brand);background:var(--panel-2)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.good:hover{filter:brightness(1.08);background:var(--good)}
.btn.danger{color:var(--warn);border-color:#F0C7C7}
.btn.danger:hover{background:#FEF2F2;border-color:var(--warn)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.55}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.sp{flex:1}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tile .v{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:600;margin-top:6px;letter-spacing:-1px}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.tile.hot .v{color:var(--gold)}
.tile.act{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,116,144,.09)}

/* table */
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--panel-2);text-align:left;padding:9px 12px;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
.biz{font-weight:600}
.biz small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px}

.score{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;border-radius:6px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.score.high{background:#FEF3E2;color:#B45309}
.score.med{background:#E0F2F7;color:#0E7490}
.score.low{background:#EEF2F5;color:#64748B}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.new,.pill.discovered,.pill.researched{background:#EEF2F5;color:#546471}
.pill.scored,.pill.drafted{background:#E0F2F7;color:#0E7490}
.pill.pending_approval{background:#FEF3E2;color:#B45309}
.pill.queued,.pill.sending{background:#E5F6FA;color:#0B7285}
.pill.sent,.pill.contacted{background:#E7F6EF;color:#0E7A54}
.pill.rejected,.pill.failed,.pill.unqualified,.pill.below_threshold{background:#FBEAEA;color:#B42318}
.pill.cancelled{background:#EEF2F5;color:#546471}
.pill.replied{background:#FEF3E2;color:#B45309}
.tag{display:inline-block;background:#E0F2F7;color:var(--brand);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.tag.grey{background:#EEF2F5;color:#546471}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;background:var(--panel);color:var(--ink);font-size:13px}
.filters input[type=search]{min-width:200px}

/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.inp{display:flex;flex-direction:column;gap:5px}
.inp label{font-size:12px;font-weight:600}
.inp input,.inp select,.inp textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--panel-2);color:var(--ink);width:100%}
.inp input:focus,.inp textarea:focus,.inp select:focus{outline:2px solid var(--brand-2);background:#fff}
.inp textarea{min-height:150px;resize:vertical;line-height:1.6;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.inp .fine{font-size:11px;color:var(--muted)}

/* outbox */
.ob{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.ev{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;font-size:12.5px;line-height:1.55}
.ev.cited{border-left-color:var(--gold);background:#FFFBF3}
.ev .t{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:3px;display:flex;gap:7px;align-items:center}
.ev .q{color:var(--ink)}
.ev a{font-size:11.5px;word-break:break-all}
.badge{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.3px}
.badge.exp{background:#FEF3E2;color:#B45309}
.badge.inf{background:#EEF2F5;color:#64748B}
.badge.cit{background:var(--gold);color:#fff}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;z-index:40}
.drawer-bg.on{display:block}
.drawer{position:fixed;top:0;right:0;width:760px;max-width:100%;height:100vh;background:var(--bg);box-shadow:-10px 0 40px -12px rgba(0,0,0,.3);overflow-y:auto;padding:24px 26px 60px;z-index:41;transform:translateX(100%);transition:transform .2s}
.drawer.on{transform:none}

/* log */
.log{background:var(--dark);color:#C9D6DF;border-radius:var(--r-sm);padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;max-height:440px;overflow-y:auto;white-space:pre-wrap}


/* ==================== agent control room ==================== */
/* Minimal palette: near-black panels, white type, and one accent kept for
   whatever is happening right now. Motion does the rest. */
:root{--acc:#22D3EE;--acc-rgb:34 211 238;--night:#0B0F14;--night-2:#11161E}

@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes radar{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes tick{0%{transform:translateY(-30%);opacity:.2}100%{transform:none;opacity:1}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes topline{from{background-position:150% 0}to{background-position:-50% 0}}

.btn.go{background:#0F172A;color:#fff;border-color:#0F172A}
.btn.go:hover{background:#1E293B;border-color:#1E293B}
.btn.go.stop{background:#DC2626;border-color:#DC2626}
.btn.go.stop:hover{background:#B91C1C;border-color:#B91C1C}
.spin.dark{border-color:rgba(180,35,24,.2);border-top-color:#B42318}
.hx-stop{align-self:stretch;min-height:58px;padding:0 18px;border-radius:12px;font-weight:600;font-size:13px;
  color:#F2A0A0;background:rgba(242,160,160,.06);border:1px solid rgba(242,160,160,.35);transition:background .15s}
.hx-stop:hover{background:rgba(242,160,160,.14)}
.hx-stop:disabled{opacity:.6;cursor:default}

.hx{position:relative;isolation:isolate;overflow:hidden;border-radius:18px;padding:26px 26px 22px;margin-bottom:16px;color:#E8EEF4;
  background:linear-gradient(180deg,var(--night-2) 0%,var(--night) 100%);border:1px solid rgba(255,255,255,.06);
  box-shadow:0 22px 44px -30px rgba(8,15,25,.85)}
.hx::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 60% 90% at 100% 0%,#000,transparent 70%);mask-image:radial-gradient(ellipse 60% 90% at 100% 0%,#000,transparent 70%)}
.hx::after{content:'';position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.hx.live::after{background:linear-gradient(90deg,transparent 0 40%,var(--acc) 50%,transparent 60% 100%);background-size:250% 100%;animation:topline 2.4s linear infinite}
.hx-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.hx-main{min-width:0;animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both}
.pchip{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:1.6px;padding:5px 11px;border-radius:20px;
  color:#C3CCD6;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12)}
.pchip .pd{position:relative;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.pchip .pd::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--acc);animation:radar 2s ease-out infinite}
.pchip.live{color:#fff;border-color:rgb(var(--acc-rgb) / .4)}
.pchip.live .pd::after{animation-duration:1s}
.pchip.off .pd{background:#5B6876}
.pchip.off .pd::after{display:none}
.hx-title{font-family:'Space Grotesk',sans-serif;font-size:34px;line-height:1.1;margin:14px 0 8px;letter-spacing:-1px;font-weight:700;color:#fff;overflow-wrap:anywhere}
.hx-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:#8E9BA9;font-size:13px}
.hx-meta .tag{background:rgba(255,255,255,.07);color:#D5DDE5}
.hx-meta .sep{width:3px;height:3px;border-radius:50%;background:#4A5662}
.hx-note{color:#8E9BA9;font-size:13px;margin:14px 0 0;max-width:52ch;line-height:1.55}

.cd{display:flex;align-items:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.cd-u{display:flex;flex-direction:column;align-items:center;gap:7px}
.cd-u[hidden]{display:none}
.cd-u b{display:block;min-width:66px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:700;line-height:1;
  padding:12px 8px 10px;border-radius:12px;color:#fff;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.cd-u b[data-u="s"]{color:var(--acc)}
.cd-u b.tick{animation:tick .4s cubic-bezier(.2,.8,.2,1)}
.cd-u span{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6B7886;font-weight:600}
.cd>i{font-style:normal;font-family:'Space Grotesk',sans-serif;font-size:30px;color:#3E4955;padding-bottom:28px;animation:blink 1s steps(2,start) infinite}
.cd-go{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--acc);animation:blink 1s ease-in-out infinite}

.hx-live{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.hx-stage{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:10px 14px;min-width:150px}
.hx-stage span{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#6B7886;font-weight:600;margin-bottom:4px}
.hx-stage b{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff}
.hx-stage b.mono{color:var(--acc)}
.hx-item{margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8E9BA9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hx-queue{min-width:0;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px;
  animation:riseIn .5s .08s cubic-bezier(.2,.8,.2,1) both}
.hx-qh{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#6B7886;font-weight:700;padding:2px 4px 8px}
.hx-qh span{letter-spacing:0;text-transform:none;font-weight:600;color:#55616D}
.hx-q{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:8px 9px;color:#D5DDE5;
  transition:background .15s,border-color .15s}
.hx-q:hover{background:rgba(255,255,255,.04)}
.hx-q:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hx-q.first{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
.hx-q .qd{width:7px;height:7px;border-radius:50%;background:#4A5662;flex-shrink:0}
.hx-q.first .qd{background:var(--acc);box-shadow:0 0 0 3px rgb(var(--acc-rgb) / .15)}
.hx-q .qn{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-q .qn small,.hx-q .qt small{display:block;font-weight:500;font-size:11px;color:#6B7886}
.hx-q .qt{text-align:right;font-size:12px;font-weight:600;white-space:nowrap}
.hx-q.first .qt small{color:var(--acc)}
.hx-empty{color:#6B7886;font-size:12.5px;padding:8px 4px}

.hx-stats{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.07)}
.hx-cap{font-size:12px;color:#7D8A97;margin-bottom:12px;line-height:1.5}
.hx-cap b{color:#E8EEF4;font-weight:600}
.hx-tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.hx-t{position:relative;overflow:hidden;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px 12px 11px;
  animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms);transition:border-color .2s,background .2s}
.hx-t:hover{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.045)}
.hx-t .ti{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#8E9BA9;background:rgba(255,255,255,.05)}
.hx-t .tv{display:block;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#fff;margin-top:9px;line-height:1;font-variant-numeric:tabular-nums;transform-origin:left center}
.hx-t .tv.zero{color:#3F4A55}
.hx-t .tk{display:block;font-size:11px;color:#7D8A97;margin-top:4px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx.live .hx-t::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.05) 50%,transparent 65%);
  background-size:250% 100%;animation:sheen 2.6s linear infinite}
.bump{animation:bump .5s cubic-bezier(.2,.8,.2,1)}

/* ---- pipeline: a package travels from step to step, and each step has its own motion ---- */
@keyframes pkgMove{0%{left:-14px;opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1)}85%{opacity:1;transform:scale(1)}100%{left:calc(100% + 12px);opacity:0;transform:scale(.6)}}
@keyframes fxBump{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes fxGlow{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent),0 0 18px -6px color-mix(in srgb,var(--c) 60%,transparent)}
  50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 6%,transparent),0 0 28px -4px color-mix(in srgb,var(--c) 80%,transparent)}}
@keyframes fxRipple{0%{transform:scale(1);opacity:.9}100%{transform:scale(2);opacity:0}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxMergeL{0%{opacity:0;transform:none}20%{opacity:1}70%{opacity:1;transform:translateX(14px)}100%{opacity:0;transform:translateX(14px) scale(1.8)}}
@keyframes fxMergeR{0%{opacity:0;transform:none}20%{opacity:1}70%{opacity:1;transform:translateX(-14px)}100%{opacity:0;transform:translateX(-14px) scale(1.8)}}
@keyframes fxScan{0%{transform:translateY(6px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(42px);opacity:0}}
@keyframes fxMark{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes fxArc{0%{stroke-dashoffset:189;opacity:1}75%{stroke-dashoffset:50;opacity:1}100%{stroke-dashoffset:50;opacity:0}}
@keyframes fxType{0%,100%{opacity:.15;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes fxDrop{0%{transform:translateY(-14px);opacity:0}25%{opacity:1}75%{transform:translateY(22px);opacity:1}100%{transform:translateY(28px);opacity:0}}

.wf{position:relative;isolation:isolate;overflow:hidden;border-radius:18px;padding:20px 22px 16px;color:#E8EEF4;
  background:linear-gradient(180deg,var(--night-2) 0%,var(--night) 100%);border:1px solid rgba(255,255,255,.06);box-shadow:0 22px 44px -30px rgba(8,15,25,.85)}
.wf-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.wf-head h3{margin:0;color:#fff;font-size:15px}
.wf-sub{color:#7D8A97;font-size:12.5px}
.wf-live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.8px;padding:4px 10px;border-radius:20px;
  color:#C3CCD6;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.wf-live .bl{width:6px;height:6px;border-radius:50%;background:currentColor}
.wf-live.run{color:var(--acc);border-color:rgb(var(--acc-rgb) / .35)}
.wf-live.run .bl{animation:blink 1.1s ease-in-out infinite}
.wf-live.done{color:#E8EEF4}
.wf-live.fail{color:#F2A0A0;border-color:rgba(242,160,160,.3)}
.wf-live.idle{color:#7D8A97}

.wf-flow{display:flex;align-items:flex-start;overflow-x:auto;padding:22px 4px 12px}
.wf-flow::-webkit-scrollbar{height:7px}
.wf-flow::-webkit-scrollbar-thumb{background:#26303B;border-radius:4px}

.node{--c:var(--acc);flex:0 0 88px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
  animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.node.work{--it:1}
.node.running{--it:infinite}
.nc{position:relative;z-index:2;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  background:#0F141B;border:1px solid rgba(255,255,255,.09);color:#56636F;transition:border-color .3s,color .3s}
.nc>svg:not(.ring){position:relative;z-index:1}
.node.done .nc{border-color:color-mix(in srgb,var(--c) 40%,rgba(255,255,255,.08));color:var(--c)}
.node.work .nc{color:var(--c);border-color:var(--c);animation:fxBump .55s cubic-bezier(.2,.8,.2,1)}
.node.running .nc{color:var(--c);border-color:var(--c);animation:fxGlow 1.6s ease-in-out infinite}
.node.error .nc{color:#F2A0A0;border-color:rgba(242,160,160,.6)}
.node.skipped{opacity:.4}
.nc .fx{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;z-index:2}
.nc .fx i{position:absolute;display:block;opacity:0}
.nc .ring{position:absolute;left:-7px;top:-7px;width:64px;height:64px;pointer-events:none;overflow:visible;z-index:0}
.nc .ring circle{fill:none;stroke:var(--c);stroke-width:1.5;opacity:0}
.okb{position:absolute;right:-3px;bottom:-1px;z-index:3;width:15px;height:15px;border-radius:50%;display:none;place-items:center;
  background:#E8EEF4;color:#0B0F14;font-size:9px;font-weight:800;box-shadow:0 0 0 2px var(--night)}
.node.done .okb{display:grid}
.node.running .okb{display:none}
.eng{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:3;font-size:8px;font-weight:700;letter-spacing:.7px;
  padding:1px 5px;border-radius:4px;color:#8E9BA9;background:var(--night);border:1px dashed rgba(255,255,255,.25)}
.nname{margin-top:11px;font-size:12px;font-weight:600;color:#8E9BA9;white-space:nowrap}
.node.done .nname,.node.running .nname,.node.work .nname{color:#E8EEF4}
.nnote{font-size:10.5px;color:#56636F;line-height:1.35;margin-top:2px;min-height:28px;max-width:88px}
.nfoot{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:6px}
.cnt{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.cnt.zero{color:#3A444F}
.drop{font-size:10.5px;font-weight:600;color:#E58E8E}

/* Trigger: a pulse leaves the switch */
.node[data-k=trigger] .nc::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1.5px solid var(--c);opacity:0;pointer-events:none}
.node[data-k=trigger]:is(.work,.running) .nc::after{animation:fxRipple 1.3s ease-out var(--it)}
/* Discovery: radar sweep */
.node[data-k=discovery] .fx::before{content:'';position:absolute;inset:0;border-radius:50%;opacity:0;
  background:conic-gradient(from 0deg,transparent 0 280deg,color-mix(in srgb,var(--c) 55%,transparent) 360deg)}
.node[data-k=discovery]:is(.work,.running) .fx::before{opacity:1;animation:fxSpin 1.2s linear var(--it)}
/* Resolution: two records merge into one */
.node[data-k=resolution] .fx i{width:6px;height:6px;border-radius:50%;background:var(--c);top:35px}
.node[data-k=resolution] .fx i:nth-child(1){left:8px}
.node[data-k=resolution] .fx i:nth-child(2){right:8px}
.node[data-k=resolution]:is(.work,.running) .fx i:nth-child(1){animation:fxMergeL 1.2s ease-in-out var(--it)}
.node[data-k=resolution]:is(.work,.running) .fx i:nth-child(2){animation:fxMergeR 1.2s ease-in-out var(--it)}
/* Research: a scan line passes over their site */
.node[data-k=research] .fx::before{content:'';position:absolute;left:5px;right:5px;top:0;height:2px;border-radius:2px;
  background:var(--c);box-shadow:0 0 10px var(--c);opacity:0}
.node[data-k=research]:is(.work,.running) .fx::before{animation:fxScan 1.2s ease-in-out var(--it)}
/* Evidence: lines of proof get highlighted */
.node[data-k=signals] .fx::before,.node[data-k=signals] .fx::after{content:'';position:absolute;left:14px;height:2px;border-radius:2px;
  background:var(--c);transform-origin:left;transform:scaleX(0)}
.node[data-k=signals] .fx::before{top:34px;width:22px}
.node[data-k=signals] .fx::after{top:39px;width:14px}
.node[data-k=signals]:is(.work,.running) .fx::before{animation:fxMark 1.2s ease-out var(--it)}
.node[data-k=signals]:is(.work,.running) .fx::after{animation:fxMark 1.2s ease-out .2s var(--it)}
/* Qualify: the AI considers it - a dashed ring turns */
.node[data-k=qualify]:is(.work,.running) .ring{animation:fxSpin 2s linear var(--it)}
.node[data-k=qualify]:is(.work,.running) .ring circle{opacity:.9;stroke-dasharray:3 6}
/* Scoring: a score arc fills */
.node[data-k=scoring] .ring circle{stroke-dasharray:189;stroke-dashoffset:189}
.node[data-k=scoring]:is(.work,.running) .ring circle{opacity:1;animation:fxArc 1.2s cubic-bezier(.2,.8,.2,1) var(--it)}
/* Personalize: typing */
.node[data-k=personalize] .fx i{width:4px;height:4px;border-radius:50%;background:var(--c);top:37px}
.node[data-k=personalize] .fx i:nth-child(1){left:17px}
.node[data-k=personalize] .fx i:nth-child(2){left:23px}
.node[data-k=personalize] .fx i:nth-child(3){left:29px}
.node[data-k=personalize].work{--it:2}
.node[data-k=personalize]:is(.work,.running) .fx i{animation:fxType .8s ease-in-out var(--it)}
.node[data-k=personalize]:is(.work,.running) .fx i:nth-child(2){animation-delay:.13s}
.node[data-k=personalize]:is(.work,.running) .fx i:nth-child(3){animation-delay:.26s}
/* Outbox: the package drops in */
.node[data-k=outbox] .fx i:nth-child(1){left:20px;top:2px;width:10px;height:10px;border-radius:2px;background:var(--c)}
.node[data-k=outbox]:is(.work,.running) .fx i:nth-child(1){animation:fxDrop 1.1s cubic-bezier(.5,0,.75,0) var(--it)}

.conn{--c1:#E8EEF4;--c2:#E8EEF4;position:relative;flex:1 1 34px;min-width:26px;height:52px}
.conn .line{position:absolute;top:50%;left:-18px;right:-18px;height:1px;background:rgba(255,255,255,.09)}
.conn.past .line{background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 45%,transparent),color-mix(in srgb,var(--c2) 45%,transparent))}
.conn.flow .line{background:linear-gradient(90deg,color-mix(in srgb,var(--c1) 50%,transparent),var(--c2))}
.pkg{position:absolute;z-index:1;top:calc(50% - 5px);left:-14px;width:10px;height:10px;border-radius:2.5px;opacity:0;
  background:var(--c2);box-shadow:0 2px 6px rgba(0,0,0,.55)}
.pkg::before,.pkg::after{content:'';position:absolute;background:rgba(11,15,20,.35)}
.pkg::before{left:calc(50% - .75px);top:0;bottom:0;width:1.5px}
.pkg::after{top:calc(50% - .75px);left:0;right:0;height:1.5px}
.conn.send .pkg:first-of-type{animation:pkgMove .8s cubic-bezier(.45,.05,.3,1)}
.conn.flow .pkg{box-shadow:0 0 10px color-mix(in srgb,var(--c2) 70%,transparent);animation:pkgMove 1.2s linear infinite}
.conn.flow .pkg:nth-of-type(2){animation-delay:-.6s}

.wf-now{display:flex;align-items:center;gap:11px;color:#A3AFBB;font-size:12.5px;line-height:1.5;margin-top:6px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:10px 13px}
.wf-now b{color:#fff;font-weight:600}
.wf-now .nx-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:#E8EEF4;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.wf-now .js-in{color:var(--acc);font-weight:600}
.wf-detail{color:#6B7886;font-size:11.5px;margin-top:2px;font-family:ui-monospace,Menlo,monospace}
.wf-term{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:10px;margin-top:12px;
  font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.75;color:#93A1AF;
  max-height:210px;overflow-y:auto;padding:11px 13px;white-space:pre-wrap}
.wf-term::-webkit-scrollbar{width:7px}
.wf-term::-webkit-scrollbar-thumb{background:#26303B;border-radius:4px}
.wf-term .ok{color:#E8EEF4} .wf-term .no{color:#E58E8E} .wf-term .hl{color:var(--acc)}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:11px;color:#6B7886}

.legend .lg-llm{font-size:8px;font-weight:700;letter-spacing:.6px;padding:0 4px;border-radius:3px;border:1px dashed rgba(255,255,255,.3);color:#8E9BA9}

/* ==================== campaigns ==================== */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px}
.camp{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;animation:riseIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
.camp:hover{transform:translateY(-2px);border-color:#C3CED8;box-shadow:0 16px 32px -22px rgba(15,23,42,.45)}
.camp:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,116,144,.2)}
.camp.off{opacity:.7}
.camp-top{display:flex;align-items:center;gap:11px}
.camp-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:#0F172A}
.camp.off .camp-ico{background:#94A3B8}
.camp-name{flex:1;min-width:0}
.camp-name b{display:block;font-family:'Space Grotesk',sans-serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp-name small{color:var(--muted);font-size:12px}
.camp-when{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:14px 0 10px;font-size:12.5px;font-weight:600}
.camp-when svg{color:var(--muted)}
.camp-when .nx{margin-left:auto;font-size:11.5px;font-weight:600;color:#334155;background:#F1F5F9;padding:3px 10px;border-radius:20px}
.camp-when .nx.off{color:#64748B}
.camp-when .nx.live{color:#fff;background:#0F172A}
.camp-when .nx.live::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:6px;vertical-align:1px;
  animation:blink 1.1s ease-in-out infinite}
.camp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.camp-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.camp-stats b{display:block;font-family:'Space Grotesk',sans-serif;font-size:18px}
.camp-stats span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.camp-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.camp-log{background:none;border:0;padding:4px 0;color:var(--muted);font-size:12px;text-align:left}
.camp-log:hover{color:var(--brand);text-decoration:underline}
.btn.icon{padding:5px 7px}
.btn.icon:hover{color:var(--warn)}

.sw{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:22px;background:#CBD5E1;transition:background .2s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+i{background:var(--brand)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--brand-2);outline-offset:2px}

/* campaign editor (drawer) */

  background:radial-gradient(520px 200px at 0% 0%,rgba(255,255,255,.07),transparent 70%),var(--night)}

.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start}

  background:rgba(238,242,245,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px}
.mini-ico{width:28px;height:28px;border-radius:8px;background:#0F172A;color:#fff;display:grid;place-items:center;flex-shrink:0}
.av-s{width:32px;height:32px;border-radius:9px;background:#E0F2F7;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.lockt{color:var(--warn);font-weight:600}
.chart{display:block;overflow:visible}
.bar-hit{cursor:default}
.bar-hit.on path{filter:brightness(1.15)}
.bar-hit.on rect{fill:rgba(8,145,178,.06)}
.ctip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:500;
  padding:6px 9px;border-radius:7px;opacity:0;transition:opacity .1s;white-space:nowrap}
.tile .v{word-break:break-word}

/* outbox: who sends the queue */
.sendbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}
.sendbar code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
.pcdot{width:10px;height:10px;border-radius:50%;background:#CBD5E1;flex-shrink:0}
.pcdot.on{background:var(--good);box-shadow:0 0 0 4px rgba(14,159,110,.15)}

/* instant feedback while the server answers */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:2px;z-index:100;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,var(--brand-2),transparent);background-size:40% 100%;background-repeat:no-repeat;
  animation:busybar 1s linear infinite;transition:opacity .2s}
body.busy::before{opacity:1;transition-delay:.12s}
@keyframes busybar{from{background-position:-40% 0}to{background-position:140% 0}}
.view.loading{opacity:.55;pointer-events:none;transition:opacity .15s .1s}
button.is-busy{pointer-events:none;opacity:.7}
.btn.is-busy::after{content:'';width:10px;height:10px;margin-left:2px;border-radius:50%;
  border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:16px}
.bar{height:7px;border-radius:4px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--brand)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:12px 19px;border-radius:9px;font-weight:500;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);opacity:0;transition:.28s;z-index:90;max-width:80vw}
.toast.on{transform:translateX(-50%);opacity:1}
.toast.bad{background:var(--warn)}
.toast.good{background:var(--good)}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:#FFFBF3;border:1px solid #F5D9A8;color:#8A5A0B;border-radius:var(--r-sm);padding:11px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.55}
.banner.bad{background:#FEF2F2;border-color:#F3C7C7;color:#9B1C1C}

@media (max-width:1000px){
  body{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .side-foot{display:none}
  .nav button{width:auto;padding:7px 10px;font-size:13px}
  .nav .grp{display:none}
  .me{width:100%;margin-top:6px;padding-top:8px}
  .abar{padding:10px 16px}
  .main{height:auto}
  .ob,.grid2{grid-template-columns:1fr}
  .view{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

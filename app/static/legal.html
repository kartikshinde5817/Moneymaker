<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{PLATFORM}}</title>
<meta name="description" content="{{TITLE}} for {{PLATFORM}}.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1220;--ink-2:#1F2A37;--muted:#5B6878;--line:#E3E8EE;--bg:#F7F9FB;--panel:#fff;--brand:#0E7490;--brand-2:#06B6D4;--good:#0E9F6E;--bad:#B42318}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#E8EEF4;--ink-2:#C9D4DE;--muted:#93A1AF;--line:#26303B;--bg:#0B0F14;--panel:#11161E;--brand:#22D3EE;--brand-2:#22D3EE}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.7}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
h1,h2{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--panel)}
header.top .wrap{max-width:1160px;display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--ink)}
.logo i{width:30px;height:30px;border-radius:9px;background:#0B1220;display:grid;place-items:center;color:#5EEAD4;font-style:normal;font-size:16px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);color:var(--ink);background:var(--panel);cursor:pointer;font-family:inherit}
.btn.primary{background:#0B1220;color:#fff;border-color:#0B1220}.btn:hover{text-decoration:none;border-color:#9AA8B6}
.btn[disabled]{opacity:.6;cursor:default}
main{padding:44px 0 70px}
.kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:700}
h1{font-size:clamp(30px,5vw,42px);line-height:1.12;margin:8px 0 6px}
.upd{color:var(--muted);font-size:14px;margin-bottom:28px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,40px)}
.doc h2{font-size:21px;margin:34px 0 8px;scroll-margin-top:20px}.doc h2:first-child{margin-top:0}
.doc p,.doc li{color:var(--ink-2)}.doc ul{padding-left:22px}.doc li{margin:6px 0}
.doc table{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0}
.doc th,.doc td{text-align:left;vertical-align:top;border:1px solid var(--line);padding:10px 12px}
.doc th{background:var(--bg);font-size:13px;color:var(--muted)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.toc a{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--muted);background:var(--panel)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0 26px}
.cbox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);font-size:14.5px;overflow-wrap:anywhere}
form.contact{display:grid;gap:14px;margin-top:6px}
label{font-size:13px;font-weight:600;color:var(--ink-2)}
input,textarea{width:100%;margin-top:5px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--panel);color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(6,182,212,.18)}
textarea{min-height:140px;resize:vertical}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.note{padding:11px 14px;border-radius:10px;font-size:14px;display:none}
.note.ok{display:block;background:#ECFDF3;color:#067647;border:1px solid #ABEFC6}
.note.err{display:block;background:#FEF3F2;color:var(--bad);border:1px solid #FECDCA}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px}
footer .wrap{max-width:1160px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--muted)}
@media (max-width:560px){header.top .btn.ghost{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/"><i>₹</i>{{PLATFORM}}</a><span class="sp"></span>
  <a class="btn ghost" href="/login">Sign in</a><a class="btn primary" href="/signup">Start free trial</a>
</div></header>
<main><div class="wrap">
  <div class="kick">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <div class="upd">{{SUBTITLE}}</div>
  {{TOC}}
  <div class="doc">{{BODY}}</div>
</div></main>
<footer><div class="wrap"><span>© <span id="yr"></span> {{COMPANY}}</span>
  <span><a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/refund">Refunds</a> · <a href="/contact">Contact</a></span></div></footer>
<script>
document.getElementById('yr').textContent = new Date().getFullYear();
const f = document.getElementById('cform');
if (f) f.onsubmit = async e => {
  e.preventDefault();
  const note = document.getElementById('cnote'), btn = f.querySelector('button');
  note.className = 'note';
  const body = Object.fromEntries(new FormData(f));
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch('/api/public/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(Array.isArray(d.detail) ? 'Please check the form: ' + d.detail.map(x => x.loc.slice(-1) + ' — ' + x.msg).join('; ') : (d.detail || 'Something went wrong'));
    note.className = 'note ok'; note.textContent = 'Thank you. Your message is on its way, and we will reply by email.'; f.reset();
  } catch (err) { note.className = 'note err'; note.textContent = err.message; }
  btn.disabled = false; btn.textContent = 'Send message';
};
</script>
</body>
</html>
